<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Snap – Playverse</title>
<meta name="description" content="Time Snap: stop the hidden clock at the exact moment, or out-react your friends. A free multiplayer game on Playverse.">
<script>try{var t=localStorage.getItem("pv-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#f4f5ff;--card:#fff;--ink:#14142b;--mut:#5d5f80;--line:#dcdef5;--acc:#6c5cff;--acc2:#ff5c9d;--glow:rgba(108,92,255,.25);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b1a;--card:#15152b;--ink:#f1f1ff;--mut:#9a9cc4;--line:#262647;--glow:rgba(108,92,255,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b1a;--card:#15152b;--ink:#f1f1ff;--mut:#9a9cc4;--line:#262647;--glow:rgba(108,92,255,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;pointer-events:none}.o1{width:280px;height:280px;background:var(--acc);top:-80px;left:-80px}.o2{width:240px;height:240px;background:var(--acc2);bottom:-60px;right:-60px}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:14px 16px 30px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
header a{color:var(--ink);text-decoration:none;font-weight:700}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer;font-size:15px}
h1{margin:6px 0 2px;font-size:2.4rem;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 30px var(--glow);text-align:center}
.mut{color:var(--mut);font-size:.9rem}
button{font:inherit}
.btn{width:100%;border:0;border-radius:99px;padding:14px;margin:6px 0;font-weight:800;font-size:1rem;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer}
.btn:disabled{opacity:.45}
.ghost{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:12px;margin:6px 0;font-weight:700;cursor:pointer}
.seg{display:flex;gap:8px;margin:8px 0}.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:10px 4px;font-weight:700;cursor:pointer}.seg button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border:0}
input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem;text-align:center;letter-spacing:4px;text-transform:uppercase}
.code{font-size:2.6rem;font-weight:900;letter-spacing:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);margin:6px 0;text-align:left}.row.w{outline:2px solid var(--acc2)}
.tg{font-size:1.1rem;margin:6px 0}.tg b{font-size:2.4rem;display:block}
.stop{width:220px;height:220px;border-radius:50%;border:0;margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stop b{font-size:2.6rem}.stop small{opacity:.9}
.stop.wait{background:#7a7ca8}.stop.run{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 40px var(--glow)}.stop.hold{background:#e5384e}.stop.go{background:#1fc36a;box-shadow:0 0 50px #1fc36a88}.stop.done{background:#444866;opacity:.8}
.err{color:var(--acc2);font-weight:700}
.pad{width:100%;height:96px;border:0;border-radius:22px;font-size:1.6rem;font-weight:900;color:#fff;margin:8px 0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}.pad.s{background:linear-gradient(90deg,var(--acc),var(--acc2))}.pad.x{background:#e5384e}.pad:disabled{opacity:.35}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:18px}
.hide{display:none}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
<header><a href="/">← Playverse</a><span><button class="tb hide" id="so">Sign out</button> <button class="tb" id="th">🌙</button></span></header>
<h1>TIME SNAP</h1><p class="sub">Stop the clock. Beat your friends.</p>
<div id="se" class="err" style="text-align:center;margin:6px 0"></div>
<div id="v"></div>
<footer>🐞 Found a bug? Message us on Discord: <b id="dc" style="cursor:pointer;text-decoration:underline">dryer0531</b> <span id="cp"></span></footer>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,serverTimestamp,increment,runTransaction,collection,query,orderBy,limit,getDocs,deleteField}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDHcp44KXR6Gax_Vf3fwdinWBgJB4l_92Y",authDomain:"clue-rush-a7bbe.firebaseapp.com",projectId:"clue-rush-a7bbe",storageBucket:"clue-rush-a7bbe.firebasestorage.app",messagingSenderId:"439710542707",appId:"1:439710542707:web:b55e0a8f2c309b86e8b306"}),auth=getAuth(app),fs=getFirestore(app);
const E=id=>document.getElementById(id),V=E("v"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ST0=0,AR=0,S=null,U=null,NM="",off=0,code="",R=null,unsub=null,ref=null,stopped=0,seenRd=-1,mine=[],rec="",lastRes=-1,lb=null,tab="wins",msg="",busy=0,mode="t",rounds=3;
const sn=()=>Date.now()+off,rr=c=>doc(fs,"timesnapRooms",c),ms=x=>x&&x.toMillis?x.toMillis():0,fT=v=>{v=Math.max(0,Math.round(v));return[Math.floor(v/60000),Math.floor(v/1000)%60,Math.floor(v/10)%100].map(x=>String(x).padStart(2,"0")).join(":")};
/* theme + discord */
const root=document.documentElement,dark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches,ic=()=>{E("th").textContent=dark()?"☀️":"🌙"};ic();
E("th").onclick=()=>{const t=dark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("pv-theme",t)}catch(e){}ic()};
E("dc").onclick=()=>{try{navigator.clipboard.writeText("dryer0531")}catch(e){}E("cp").textContent="(copied ✓)";setTimeout(()=>E("cp").textContent="",2000)};
/* clock sync with the server */
async function sync(){let best=1e9;for(let i=0;i<3;i++){try{const r=doc(fs,"timesnapPing",U.uid),a=Date.now();await setDoc(r,{at:serverTimestamp()});const s=await getDoc(r),b=Date.now();if(s.data().at&&b-a<best){best=b-a;off=s.data().at.toMillis()-(a+b)/2}}catch(e){}}}
/* rooms */
const genCode=()=>Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random()*23)]).join("");
async function create(){for(let i=0;i<6;i++){const c=genCode();try{if((await getDoc(rr(c))).exists())continue;await setDoc(rr(c),{host:U.uid,mode,rounds,rd:0,st:"lobby",pl:{[U.uid]:NM},sc:{[U.uid]:0},stops:{},win:"",at:serverTimestamp()});return watch(c)}catch(e){msg="Could not create the room.";return render()}}}
async function join(c){c=String(c||"").toUpperCase().trim();if(c.length!==4){msg="Enter the 4-letter code.";return render()}
 let s;try{s=await getDoc(rr(c))}catch(e){msg="Could not reach the room.";return render()}
 if(!s.exists()){msg="No room with that code.";return render()}const d=s.data();
 if(!d.pl[U.uid]){if(d.st!=="lobby"){msg="That game already started.";return render()}if(Object.keys(d.pl).length>=8){msg="Room is full (8 max).";return render()}
  try{await updateDoc(rr(c),{["pl."+U.uid]:NM,["sc."+U.uid]:0})}catch(e){msg="Could not join.";return render()}}
 watch(c)}
function watch(c){code=c;ref=rr(c);msg="";mine=[];rec="";lastRes=-1;seenRd=-1;if(unsub)unsub();
 unsub=onSnapshot(ref,s=>{R=s.exists()?s.data():null;if(!R){leave();msg="That room was closed.";return render()}if(R.rd!==seenRd){seenRd=R.rd;stopped=0;ST0=0}
  if(R.st==="res"&&lastRes!==R.rd){lastRes=R.rd;const v=R.stops&&R.stops[U.uid];if(v!=null&&v>=0){if(R.mode==="r"){mine.push(v);recBest("reactBest",v)}else recBest("precBest",Math.abs(v-R.tg))}}
  if(R.st==="end"&&rec!==code){rec=code;record()}render();hostStep()},()=>{})}
function leave(){if(unsub)unsub();unsub=null;R=null;code="";ref=null;try{history.replaceState(null,"",location.pathname)}catch(e){}}
async function startRound(){const o={st:"play",rd:increment(1),stops:{},win:"",sa:serverTimestamp()};if(R.mode==="t")o.tg=Math.round((2+Math.random()*7.99)*100)*10;try{await updateDoc(ref,o)}catch(e){}}
function hostStep(){if(R&&U&&R.host===U.uid&&R.st==="res"&&R.rd>=R.rounds&&R.ra&&!busy&&sn()>ms(R.ra)+6000){busy=1;updateDoc(ref,{st:"end"}).catch(()=>{}).finally(()=>{busy=0});return}if(!R||!U||R.host!==U.uid||R.st!=="play"||!R.sa||busy)return;const go=ms(R.sa)+3000;if(go<3001)return;
 const n=Object.keys(R.pl).length,have=Object.keys(R.stops||{}).length,end=R.mode==="t"?go+R.tg+8000:ms(R.sa)+30000;
 if(have<n&&sn()<end)return;busy=1;
 const sc=u=>{const v=(R.stops||{})[u];if(v==null)return 1e9;if(R.mode==="t")return Math.abs(v-R.tg);return v<0?1e9:v};
 let best="",bs=1e9;for(const u in R.pl){const s=sc(u);if(s<bs){bs=s;best=u}}
 const o={st:"res",win:best,ra:serverTimestamp()};if(best)o["sc."+best]=increment(1);
 updateDoc(ref,o).catch(()=>{}).finally(()=>{busy=0})}
const eMsg=e=>"⚠ Score not saved ("+((e&&e.code)||"error")+"). If this keeps happening, check the Firestore rules for timesnap.";
async function recBest(f,val){try{await runTransaction(fs,async t=>{const r=doc(fs,"timesnap",U.uid),x=await t.get(r),d=x.exists()?x.data():{};if(d[f]!=null&&d[f]<=val)return;t.set(r,{...d,name:NM,[f]:val,at:serverTimestamp()})});E("se").textContent=""}catch(e){E("se").textContent=eMsg(e)}}
async function record(){const sc=R.sc||{},mx=Math.max(0,...Object.values(sc)),won=mx>0&&sc[U.uid]===mx;
 try{await runTransaction(fs,async t=>{const r=doc(fs,"timesnap",U.uid),x=await t.get(r),d=x.exists()?x.data():{};t.set(r,{...d,name:NM,wins:(d.wins||0)+(won?1:0),played:(d.played||0)+1,at:serverTimestamp()})});E("se").textContent=""}catch(e){E("se").textContent=eMsg(e)}}
function rgo(){if(ST0||stopped||!R||R.st!=="play")return;ST0=performance.now();E("rgo").disabled=true;E("rx").disabled=false}
async function rrs(){if(!ST0||stopped||!R||R.st!=="play")return;const v=Math.round(performance.now()-ST0);if(v<20)return;stopped={t:fT(v)};E("rx").disabled=true;E("rt").textContent="Your time: "+fT(v);try{await updateDoc(ref,{["stops."+U.uid]:v})}catch(e){}}
async function loadLb(t){tab=t;lb=null;E("se").textContent="";render();try{lb=(await getDocs(query(collection(fs,"timesnap"),limit(300)))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){lb=[];E("se").textContent="⚠ Couldn’t load the board ("+((e&&e.code)||"error")+")."}render()}
/* play */
async function stop(){if(stopped||!R||R.st!=="play"||!R.sa)return;const el=sn()-(ms(R.sa)+3000);if(el<0)return;let v;
 v=Math.round(el);stopped={t:R.mode==="t"?"Locked in ✓":fT(v)}
 ui();try{await updateDoc(ref,{["stops."+U.uid]:v})}catch(e){}}
function ui(){if(!R||R.st!=="play"||!R.sa)return;const b=E("stop");if(!b||!ms(R.sa))return;const el=sn()-(ms(R.sa)+3000);let c="wait",t="",s="";
 if(stopped){c="done";t=stopped.t;s="Waiting for others…"}else if(el<0){t=String(Math.ceil(-el/1000));s="Get ready…"}
 else if(R.mode==="t"){c="run";t="STOP";s="The clock is hidden"}else{c="run";t=fT(el);s="TAP TO STOP!"}
 b.className="stop "+c;b.firstElementChild.textContent=t;b.lastElementChild.textContent=s}
setInterval(()=>{ui();sui();hostStep()},60);
/* solo */
const stg=()=>Math.round((2+Math.random()*7.99)*100)*10;
function setup(){S.s0=0;S.t0=performance.now()+3000;S.tg=stg();S.tgs.push(S.tg)}
function solo(m){S={m,k:1,vals:[],tgs:[],st:"play"};setup();render()}
function sstop(){if(!S||S.st!=="play")return;const el=performance.now()-S.t0;if(el<0)return;const v=Math.round(el);S.vals.push(v);recBest("precBest",Math.abs(v-S.tg));S.st="res";render()}
function sgo(){if(!S||S.st!=="play"||S.s0)return;S.s0=performance.now();E("rgo").disabled=true;E("rx").disabled=false}
function srstop(){if(!S||S.st!=="play"||!S.s0)return;const v=Math.round(performance.now()-S.s0);if(v<20)return;S.vals.push(v);recBest("reactBest",v);S.st="res";render()}
function sui(){if(!S||S.st!=="play")return;const b=E("stop");if(!b)return;const el=performance.now()-S.t0;
 if(el>(S.m==="t"?S.tg+8000:10000)){S.vals.push(null);S.st="res";render();return}
 let c="wait",t="",s="";if(el<0){t=String(Math.ceil(-el/1000));s="Get ready…"}else if(S.m==="t"){c="run";t="STOP";s="The clock is hidden"}else{c="run";t=fT(el);s="TAP TO STOP!"}
 b.className="stop "+c;b.firstElementChild.textContent=t;b.lastElementChild.textContent=s}
function snext(){if(S.k>=5){S.st="end";recSolo();render();return}S.k++;S.st="play";setup();render()}
const sfmt=(v,tg)=>v==null?"No tap":S.m==="t"?fT(v)+" ("+(v>=tg?"+":"−")+fT(Math.abs(v-tg))+")":fT(v);
const serr=()=>S.vals.map((v,i)=>v==null?3000:Math.abs(v-S.tgs[i]));
async function recSolo(){try{await runTransaction(fs,async t=>{const r=doc(fs,"timesnap",U.uid),x=await t.get(r),d=x.exists()?x.data():{};t.set(r,{...d,name:NM,solo:(d.solo||0)+1,at:serverTimestamp()})})}catch(e){E("se").textContent=eMsg(e)}}
function soloView(){
 if(S.st==="play"){V.innerHTML=`<div class="card"><p class="mut">Solo · ${MN[S.m]} · attempt ${S.k} of 5</p>${S.m==="t"?`<div class="tg">Stop the hidden clock at<b>${fT(S.tg)}</b></div><button id="stop" class="stop wait"><b></b><small></small></button>`:`<div class="tg">Press <b>START</b>, then <b>STOP</b> as fast as you can!</div><button id="rgo" class="pad s">START</button><button id="rx" class="pad x" disabled>STOP</button>`}<button class="ghost" data-a="sexit">Quit</button></div>`;if(S.m==="t")E("stop").onpointerdown=sstop;else{E("rgo").onpointerdown=sgo;E("rx").onpointerdown=srstop}sui();return}
 if(S.st==="res"){V.innerHTML=`<div class="card"><p class="mut">Attempt ${S.k} of 5</p><h2 style="margin:6px 0">${sfmt(S.vals[S.vals.length-1],S.tgs[S.tgs.length-1])}</h2><button class="btn" data-a="snext">${S.k>=5?"See results":"Next attempt"}</button></div>`;return}
 const ok=S.vals.filter(v=>v!=null&&v>=0),e=serr(),sm=S.m==="t"?`Average error: <b>${fT(Math.round(e.reduce((a,b)=>a+b,0)/e.length))}</b>`:ok.length?`Best: <b>${fT(Math.min(...ok))}</b> · Average: <b>${fT(Math.round(ok.reduce((a,b)=>a+b,0)/ok.length))}</b>`:"No valid taps this time";
 V.innerHTML=`<div class="card"><h2 style="margin:4px 0">Solo results</h2><p>${sm}</p>${S.vals.map((v,i)=>`<div class="row"><span>Attempt ${i+1}</span><span>${sfmt(v,S.tgs[i])}</span></div>`).join("")}<p class="mut">Saved to the leaderboard ✓</p><button class="btn" data-a="sagain">Play again</button><button class="ghost" data-a="sexit">Back to menu</button></div>`}
/* views */
const names=()=>Object.keys(R.pl),stat=()=>names().map(u=>`<div class="row"><span>${esc(R.pl[u])}${u===U.uid?" (you)":""}</span><span>${R.stops&&R.stops[u]!=null?"✓":"…"}</span></div>`).join("");
const fmt=u=>{const v=(R.stops||{})[u];if(v==null)return"no tap";if(R.mode==="t")return fT(v)+" ("+(v>=R.tg?"+":"−")+fT(Math.abs(v-R.tg))+")";return fT(v)};
const board=()=>names().sort((a,b)=>(R.sc[b]||0)-(R.sc[a]||0)).map(u=>`<div class="row${R.win===u&&R.st==="res"?" w":""}"><span>${esc(R.pl[u])}${u===U.uid?" (you)":""}</span><span>${R.st==="end"?"":fmt(u)+" · "}<b>${R.sc[u]||0}</b> pts</span></div>`).join("");
const MN={t:"Hidden Timer",r:"Reaction"};
function render(){
 if(!U){V.innerHTML=`<div class="card"><p class="mut">${AR?"Taking you to Playverse to sign in…":"Loading…"}</p></div>`;return}
 if(S)return soloView();
 if(!R){const rows=(lb||[]).filter(r=>tab==="wins"?r.wins>0:tab==="react"?r.reactBest!=null:r.precBest!=null).sort((a,b)=>tab==="wins"?b.wins-a.wins:tab==="react"?a.reactBest-b.reactBest:a.precBest-b.precBest).slice(0,10);
  V.innerHTML=`<div class="card"><b>Play solo</b><p class="mut">Practice alone and climb the boards. 5 tries.</p><div class="seg"><button data-a="solo" data-v="t">⏱ Hidden Timer</button><button data-a="solo" data-v="r">⚡ Reaction</button></div></div>
  <div class="card"><b>Play with friends</b><div class="seg"><button data-a="mode" data-v="t" class="${mode==="t"?"on":""}">⏱ Hidden Timer</button><button data-a="mode" data-v="r" class="${mode==="r"?"on":""}">⚡ Reaction</button></div><div class="seg"><button data-a="rounds" data-v="3" class="${rounds===3?"on":""}">3 rounds</button><button data-a="rounds" data-v="5" class="${rounds===5?"on":""}">5 rounds</button></div><button class="btn" data-a="create">Create room</button></div>
  <div class="card"><b>Join a friend</b><input id="ci" maxlength="4" placeholder="CODE"><button class="btn" data-a="join">Join</button>${msg?`<p class="err">${esc(msg)}</p>`:""}</div>
  <div class="card"><div class="tabs"><button class="${tab==="wins"?"btn":"ghost"}" data-a="lb" data-v="wins">🏆 Wins</button><button class="${tab==="react"?"btn":"ghost"}" data-a="lb" data-v="react">⚡ Lightning</button><button class="${tab==="prec"?"btn":"ghost"}" data-a="lb" data-v="prec">🎯 Precision</button></div>${lb===null?`<p class="mut">Tap a board to load it</p>`:rows.length?rows.map((r,i)=>`<div class="row"><span>${i+1}. ${esc(r.name||"Player")}${r.id===U.uid?" (you)":""}</span><b>${tab==="wins"?r.wins+" wins":tab==="react"?fT(r.reactBest):fT(r.precBest)+" off"}</b></div>`).join(""):`<p class="mut">No scores yet. Be the first!</p>`}</div>`;return}
 const host=R.host===U.uid;
 if(R.st==="lobby"){V.innerHTML=`<div class="card"><p class="mut">Room code · ${MN[R.mode]} · ${R.rounds} rounds</p><div class="code">${code}</div><button class="ghost" data-a="share">Share invite</button></div><div class="card">${names().map(u=>`<div class="row"><span>${esc(R.pl[u])}${u===U.uid?" (you)":""}</span><span>${u===R.host?"👑":"✅"}</span></div>`).join("")}<p class="mut">${names().length} in the room (2 to 8)</p>${host?`<button class="btn" data-a="start" ${names().length<2?"disabled":""}>${names().length<2?"Need 2 players":"Start game"}</button>`:`<p class="mut">Waiting for the host to start…</p>`}<button class="ghost" data-a="leave">Leave</button></div>`;return}
 if(R.st==="play"){const b=E("pg");if(b&&b.dataset.rd==R.rd){E("sl").innerHTML=stat();ui();return}
  V.innerHTML=`<div class="card"><p class="mut">Round ${R.rd} of ${R.rounds} · ${MN[R.mode]}</p><div id="pg" data-rd="${R.rd}">${R.mode==="t"?`<div class="tg">Stop the hidden clock at<b>${fT(R.tg)}</b></div><button id="stop" class="stop wait"><b></b><small></small></button>`:`<div class="tg">Press <b>START</b>, then <b>STOP</b> as fast as you can!</div><button id="rgo" class="pad s">START</button><button id="rx" class="pad x" disabled>STOP</button><p id="rt" class="tg"></p>`}<div id="sl">${stat()}</div></div></div>`;if(R.mode==="t")E("stop").onpointerdown=stop;else{E("rgo").onpointerdown=rgo;E("rx").onpointerdown=rrs}ui();return}
 if(R.st==="res"){const w=R.win&&R.pl[R.win];V.innerHTML=`<div class="card"><p class="mut">Round ${R.rd} of ${R.rounds}${R.mode==="t"?" · target "+fT(R.tg):""}</p><h2 style="margin:4px 0">${w?"🏆 "+esc(w)+" wins the round":"No winner this round"}</h2>${board()}${host?`<button class="btn" data-a="next">${R.rd>=R.rounds?"Show final result":"Next round"}</button>`:`<p class="mut">Waiting for the host…</p>`}</div>`;return}
 const mx=Math.max(0,...Object.values(R.sc)),ws=names().filter(u=>R.sc[u]===mx&&mx>0).map(u=>esc(R.pl[u])).join(" & ");
 V.innerHTML=`<div class="card"><h2 style="margin:4px 0">${ws?"🏆 "+ws+" won!":"It’s a draw"}</h2>${board()}${host?`<button class="btn" data-a="again">Play again</button>`:`<p class="mut">Waiting for the host…</p>`}<button class="ghost" data-a="leave">Back to menu</button></div>`}
V.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="signin"){const pr=new GoogleAuthProvider();try{await signInWithPopup(auth,pr)}catch(x){const c=x&&x.code;if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,pr);else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request"){msg="Sign-in failed. Please try again.";render()}}}
 else if(a==="solo")solo(v);else if(a==="snext")snext();else if(a==="sagain")solo(S.m);else if(a==="sexit"){S=null;render()}
 else if(a==="mode"){mode=v;render()}else if(a==="rounds"){rounds=+v;render()}else if(a==="create")create();
 else if(a==="join")join(E("ci").value);else if(a==="lb")loadLb(v);
 else if(a==="share"){const t=`Join my Time Snap game! Code: ${code}\n${location.origin+location.pathname}?room=${code}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t)}catch(x){}b.textContent="Copied ✓"}}
 else if(a==="start")startRound();else if(a==="next"){if(R.rd>=R.rounds)updateDoc(ref,{st:"end"}).catch(()=>{});else startRound()}
 else if(a==="again"){mine=[];rec="";updateDoc(ref,{st:"lobby",rd:0,stops:{},win:"",sc:Object.fromEntries(names().map(u=>[u,0]))}).catch(()=>{})}
 else if(a==="leave"){if(R&&R.st==="lobby"&&R.host!==U.uid)updateDoc(ref,{["pl."+U.uid]:deleteField(),["sc."+U.uid]:deleteField()}).catch(()=>{});leave();render()}};
/* sign in */
onAuthStateChanged(auth,async u=>{AR=1;if(u&&!u.isAnonymous){U=u;NM=String(u.displayName||(u.email||"Player").split("@")[0]).split(" ")[0].slice(0,12);E("so").classList.remove("hide");render();sync();const q=new URLSearchParams(location.search).get("room");if(q&&!R)join(q)}else{U=null;E("so").classList.add("hide");render();location.replace("/?next="+encodeURIComponent(location.pathname+location.search))}});
E("so").onclick=()=>signOut(auth).finally(()=>location.reload());
render();
